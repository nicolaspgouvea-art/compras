<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras — Lista da Família</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F9F9FB;
      --surface-hover: #F2F2F7;
      --border: #E5E5EA;
      --border-focus: #FFD60A;
      --text: #1C1C1E;
      --text-muted: #8E8E93;
      --yellow: #FFD60A;
      --yellow-hover: #ECC508;
      --red: #FF3B30;
      --red-bg: #FFF2F1;
      --green: #34C759;
      --green-bg: #F0FDF4;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .screen {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo Apple Notes */
    .logo-container {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      display: inline-block;
      position: relative;
    }

    .app-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 4px;
      background-color: var(--yellow);
      border-radius: 2px;
    }

    .app-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Formulários e Campos */
    .form-group {
      margin-bottom: 20px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .counter {
      font-size: 11px;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border 0.15s, background-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      background-color: #FFFFFF;
      border-color: var(--border-focus);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px;
      user-select: none;
    }

    .toggle-pass-btn:hover {
      color: var(--text);
    }

    /* Botões */
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      user-select: none;
    }

    .btn-primary {
      background-color: var(--yellow);
      color: var(--text);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--yellow-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--surface);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Alertas */
    .msg-box {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      animation: fadeIn 0.2s;
    }

    .msg-box.error {
      display: block;
      background: var(--red-bg);
      border: 1px solid #FFD2D0;
      color: var(--red);
    }

    .helper-text {
      font-size: 11px;
      margin-top: 5px;
      display: block;
    }

    .helper-text.success { color: var(--green); }
    .helper-text.error { color: var(--red); }
    .helper-text.muted { color: var(--text-muted); }

    /* Seletor de Tamanho de Senha */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 4px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 7px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--yellow);
      color: var(--text);
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    /* PIN Numérico */
    .pin-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
    }

    .pin-box {
      width: 44px;
      height: 48px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: all 0.15s;
    }

    .pin-box:focus {
      background: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(255, 214, 10, 0.25);
    }

    /* Cores Suaves */
    .colors-grid {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 6px 0;
      padding: 4px;
    }

    .color-option {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-option:hover:not(.unavailable) {
      transform: scale(1.1);
    }

    .color-option.selected {
      border-color: var(--text);
      box-shadow: 0 0 0 3px var(--yellow);
    }

    .color-option.unavailable {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    .color-option.unavailable::after {
      content: "✕";
      font-size: 13px;
      color: #000;
      font-weight: bold;
    }

    .c-blue   { background-color: #BAE6FD; }
    .c-red    { background-color: #FECDD3; }
    .c-green  { background-color: #BBF7D0; }
    .c-purple { background-color: #DDD6FE; }
    .c-gray   { background-color: #E5E7EB; }

    /* Tela "foi !" */
    .success-container {
      text-align: center;
      padding: 40px 10px;
    }

    .success-text {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      user-select: none;
    }

    .success-text span {
      color: var(--yellow);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 16px;
      border: none;
      background: none;
    }

    .back-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">

      <!-- ======================================================== -->
      <!-- TELA 1: LOGIN                                            -->
      <!-- ======================================================== -->
      <section id="screen-login" class="screen active">
        <div class="logo-container">
          <h1 class="app-title">Compras</h1>
          <p class="app-subtitle">Lista de compras da família</p>
        </div>

        <div id="login-error" class="msg-box"></div>

        <form id="form-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-group">
            <label for="login-username">Nome de usuário</label>
            <div class="input-wrapper" style="margin-top:6px;">
              <input type="text" id="login-username" maxlength="15" placeholder="Digite seu nome" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="login-password">Senha</label>
              <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('login-password', this)">Mostrar</button>
            </div>
            <div class="input-wrapper">
              <input type="password" id="login-password" placeholder="••••" autocomplete="current-password" required>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>
        </form>

        <div class="divider"><span>ou</span></div>

        <button type="button" class="btn btn-secondary" onclick="showScreen('screen-register')">Criar perfil</button>
      </section>


      <!-- ======================================================== -->
      <!-- TELA 2: CRIAR PERFIL                                     -->
      <!-- ======================================================== -->
      <section id="screen-register" class="screen">
        <button type="button" class="back-link" onclick="showScreen('screen-login')">
          ← Voltar ao login
        </button>

        <div class="logo-container" style="margin-bottom: 20px;">
          <h2 style="font-size: 22px; font-weight: 700;">Criar perfil</h2>
          <p class="app-subtitle">Escolha seu nome, senha e cor</p>
        </div>

        <div id="reg-error" class="msg-box"></div>

        <form id="form-register" onsubmit="event.preventDefault(); handleRegister();">
          
          <!-- 1. Nome de Usuário -->
          <div class="form-group">
            <div class="label-row">
              <label for="reg-username">Nome de usuário</label>
              <span id="char-counter" class="counter">0/15</span>
            </div>
            <input type="text" id="reg-username" maxlength="15" placeholder="Ex: Nicolas" autocomplete="off" oninput="onUsernameInput(this.value)">
            <span id="username-feedback" class="helper-text muted"></span>
          </div>

          <!-- 2. Senha Numérica -->
          <div class="form-group">
            <div class="label-row">
              <label>Senha numérica</label>
              <button type="button" class="toggle-pass-btn" onclick="togglePinVisibility(this)">Mostrar</button>
            </div>

            <!-- Toggle 4 ou 6 dígitos -->
            <div class="tabs">
              <button type="button" id="tab-4" class="tab-btn active" onclick="setPinLength(4)">4 dígitos</button>
              <button type="button" id="tab-6" class="tab-btn" onclick="setPinLength(6)">6 dígitos</button>
            </div>

            <!-- PIN -->
            <div id="pin-inputs" class="pin-container"></div>
            <span class="helper-text muted" style="text-align: center;">Apenas números de 0 a 9.</span>

            <!-- Confirmação do PIN -->
            <div style="margin-top: 14px;">
              <label style="display:block; margin-bottom:6px;">Confirmar senha</label>
              <div id="pin-confirm-inputs" class="pin-container"></div>
              <span id="pin-match-feedback" class="helper-text" style="text-align: center;"></span>
            </div>
          </div>

          <!-- 3. Cor de Identificação -->
          <div class="form-group">
            <div class="label-row">
              <label>Cor do perfil</label>
              <span id="color-name-label" class="counter">Selecione uma</span>
            </div>

            <div class="colors-grid" id="colors-list">
              <!-- Renderizado via JS -->
            </div>
            <span id="color-status-feedback" class="helper-text muted">Cada perfil possui uma cor exclusiva.</span>
          </div>

          <!-- Botão Criar -->
          <button type="submit" id="btn-register" class="btn btn-primary" style="margin-top: 10px;">
            Criar perfil
          </button>
        </form>
      </section>


      <!-- ======================================================== -->
      <!-- TELA 3: CONFIRMAÇÃO ("foi !")                            -->
      <!-- ======================================================== -->
      <section id="screen-success" class="screen">
        <div class="success-container">
          <h1 class="success-text">foi <span>!</span></h1>
          <p id="success-welcome" style="margin-top: 14px; font-size: 15px; color: var(--text-muted);"></p>
          
          <button type="button" class="btn btn-secondary" style="margin-top: 32px;" onclick="logout()">
            Sair / Voltar
          </button>
        </div>
      </section>

    </div>
  </div>

  <!-- ======================================================== -->
  <!-- LÓGICA JAVASCRIPT (Armazenamento, Validações e Regras)    -->
  <!-- ======================================================== -->
  <script>
    const STORAGE_KEY = "compras_perfis_v1";
    const ATTEMPTS_KEY = "compras_login_tentativas";

    const AVAILABLE_COLORS = [
      { id: "blue",   name: "Azul-claro",     cssClass: "c-blue" },
      { id: "red",    name: "Vermelho-claro", cssClass: "c-red" },
      { id: "green",  name: "Verde-claro",    cssClass: "c-green" },
      { id: "purple", name: "Roxo-claro",     cssClass: "c-purple" },
      { id: "gray",   name: "Cinza-claro",    cssClass: "c-gray" }
    ];

    let currentPinLength = 4;
    let selectedColorId = null;
    let pinMasked = true;
    let currentLoggedUser = null;

    function getProfiles() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveProfiles(profiles) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
    }

    // Hash SHA-256 seguro via Web Crypto API nativa do navegador
    async function hashPassword(pin) {
      const msgBuffer = new TextEncoder().encode(pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');

      clearErrors();

      if (screenId === 'screen-register') {
        renderColors();
        renderPinInputs();
      }
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      if (el) {
        el.innerText = message;
        el.className = 'msg-box error';
      }
    }

    function clearErrors() {
      document.querySelectorAll('.msg-box').forEach(el => {
        el.innerText = '';
        el.className = 'msg-box';
      });
    }

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.innerText = "Ocultar";
      } else {
        input.type = "password";
        btn.innerText = "Mostrar";
      }
    }

    function togglePinVisibility(btn) {
      pinMasked = !pinMasked;
      btn.innerText = pinMasked ? "Mostrar" : "Ocultar";

      document.querySelectorAll('.pin-box').forEach(box => {
        box.type = pinMasked ? "password" : "text";
      });
    }

    function setPinLength(len) {
      currentPinLength = len;
      document.getElementById('tab-4').classList.toggle('active', len === 4);
      document.getElementById('tab-6').classList.toggle('active', len === 6);
      renderPinInputs();
    }

    function renderPinInputs() {
      createPinBoxes('pin-inputs', 'pin', currentPinLength);
      createPinBoxes('pin-confirm-inputs', 'pin-c', currentPinLength);
      checkPinMatch();
    }

    function createPinBoxes(containerId, prefix, length) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      for (let i = 0; i < length; i++) {
        const input = document.createElement('input');
        input.type = pinMasked ? "password" : "text";
        input.inputMode = "numeric";
        input.maxLength = 1;
        input.className = "pin-box";
        input.id = `${prefix}-${i}`;

        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val;

          if (val && i < length - 1) {
            document.getElementById(`${prefix}-${i + 1}`).focus();
          }
          checkPinMatch();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && i > 0) {
            const prev = document.getElementById(`${prefix}-${i - 1}`);
            prev.focus();
            prev.value = "";
          }
        });

        container.appendChild(input);
      }
    }

    function getPinValue(prefix) {
      let pin = "";
      for (let i = 0; i < currentPinLength; i++) {
        const box = document.getElementById(`${prefix}-${i}`);
        if (box) pin += box.value;
      }
      return pin;
    }

    function checkPinMatch() {
      const p1 = getPinValue('pin');
      const p2 = getPinValue('pin-c');
      const feedback = document.getElementById('pin-match-feedback');

      if (p1.length === currentPinLength && p2.length === currentPinLength) {
        if (p1 === p2) {
          feedback.innerText = "✓ As senhas coincidem";
          feedback.className = "helper-text success";
        } else {
          feedback.innerText = "✕ As senhas não coincidem";
          feedback.className = "helper-text error";
        }
      } else {
        feedback.innerText = "";
      }
    }

    function onUsernameInput(val) {
      const trimmed = val.trim();
      document.getElementById('char-counter').innerText = `${trimmed.length}/15`;

      const feedback = document.getElementById('username-feedback');
      if (!trimmed) {
        feedback.innerText = "";
        return;
      }

      const profiles = getProfiles();
      const normalized = trimmed.toLowerCase();
      const exists = profiles.some(p => p.username_normalized === normalized);

      if (exists) {
        feedback.innerText = "✕ Este nome já está sendo utilizado";
        feedback.className = "helper-text error";
      } else {
        feedback.innerText = "✓ Nome disponível";
        feedback.className = "helper-text success";
      }
    }

    function renderColors() {
      const container = document.getElementById('colors-list');
      container.innerHTML = "";

      const profiles = getProfiles();
      const usedColors = new Set(profiles.map(p => p.color));

      let availableCount = 0;

      AVAILABLE_COLORS.forEach(c => {
        const isUsed = usedColors.has(c.id);
        const div = document.createElement('div');
        div.className = `color-option ${c.cssClass} ${isUsed ? 'unavailable' : ''} ${selectedColorId === c.id ? 'selected' : ''}`;
        div.title = isUsed ? `${c.name} (já ocupada)` : c.name;

        if (!isUsed) {
          availableCount++;
          div.onclick = () => {
            selectedColorId = c.id;
            document.getElementById('color-name-label').innerText = c.name;
            renderColors();
          };
        }

        container.appendChild(div);
      });

      const feedback = document.getElementById('color-status-feedback');
      if (availableCount === 0) {
        feedback.innerText = "Atenção: todas as cores já foram ocupadas por outros perfis!";
        feedback.className = "helper-text error";
      } else {
        feedback.innerText = `${availableCount} cor(es) disponível(is).`;
        feedback.className = "helper-text muted";
      }
    }

    async function handleRegister() {
      clearErrors();
      const btn = document.getElementById('btn-register');
      btn.disabled = true;

      const rawUsername = document.getElementById('reg-username').value;
      const username = rawUsername.trim();
      const pin = getPinValue('pin');
      const pinConfirm = getPinValue('pin-c');

      if (!username) {
        showError('reg-error', 'Informe o nome de usuário.');
        btn.disabled = false;
        return;
      }
      if (username.length > 15) {
        showError('reg-error', 'O nome deve ter no máximo 15 caracteres.');
        btn.disabled = false;
        return;
      }

      if (pin.length !== currentPinLength || !/^\d+$/.test(pin)) {
        showError('reg-error', `A senha deve conter exatamente ${currentPinLength} dígitos numéricos.`);
        btn.disabled = false;
        return;
      }

      if (pin !== pinConfirm) {
        showError('reg-error', 'A confirmação de senha não confere.');
        btn.disabled = false;
        return;
      }

      if (!selectedColorId) {
        showError('reg-error', 'Selecione uma cor para o seu perfil.');
        btn.disabled = false;
        return;
      }

      const profiles = getProfiles();
      const normalizedUsername = username.toLowerCase();

      if (profiles.some(p => p.username_normalized === normalizedUsername)) {
        showError('reg-error', 'Este nome já está sendo utilizado. Escolha outro.');
        btn.disabled = false;
        return;
      }

      if (profiles.some(p => p.color === selectedColorId)) {
        showError('reg-error', 'Esta cor já foi escolhida por outro perfil.');
        renderColors();
        btn.disabled = false;
        return;
      }

      const passwordHash = await hashPassword(pin);
      const newProfile = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        username: username,
        username_normalized: normalizedUsername,
        color: selectedColorId,
        password_hash: passwordHash,
        created_at: new Date().toISOString()
      };

      profiles.push(newProfile);
      saveProfiles(profiles);

      currentLoggedUser = newProfile;
      document.getElementById('success-welcome').innerText = `Perfil de ${newProfile.username} criado com sucesso!`;
      showScreen('screen-success');

      document.getElementById('form-register').reset();
      selectedColorId = null;
      btn.disabled = false;
    }

    async function handleLogin() {
      clearErrors();
      const btn = document.getElementById('btn-login');

      const attemptsData = JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '{"count":0, "lockUntil":0}');
      const now = Date.now();

      if (attemptsData.lockUntil > now) {
        const remaining = Math.ceil((attemptsData.lockUntil - now) / 1000);
        showError('login-error', `Muitas tentativas incorretas. Aguarde ${remaining}s.`);
        return;
      }

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        showError('login-error', 'Preencha o nome de usuário e a senha.');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Entrando...";

      const profiles = getProfiles();
      const normalized = username.toLowerCase();
      const profile = profiles.find(p => p.username_normalized === normalized);
      const inputHash = await hashPassword(password);

      if (!profile || profile.password_hash !== inputHash) {
        attemptsData.count = (attemptsData.count || 0) + 1;

        if (attemptsData.count >= 5) {
          attemptsData.lockUntil = Date.now() + 15000;
          localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attemptsData));
          showError('login-error', 'Muitas tentativas incorretas. Aguarde 15 segundos.');
        } else {
          localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attemptsData));
          showError('login-error', 'Usuário ou senha incorretos.');
        }

        btn.disabled = false;
        btn.innerText = "Entrar";
        return;
      }

      localStorage.removeItem(ATTEMPTS_KEY);
      currentLoggedUser = profile;
      document.getElementById('success-welcome').innerText = `Bem-vindo de volta, ${profile.username}!`;
      showScreen('screen-success');

      btn.disabled = false;
      btn.innerText = "Entrar";
      document.getElementById('form-login').reset();
    }

    function logout() {
      currentLoggedUser = null;
      showScreen('screen-login');
    }

    renderPinInputs();
    renderColors();
  </script>
</body>
</html>
